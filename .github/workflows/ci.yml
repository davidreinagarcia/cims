# CI: indexes current + links valid + type-check/build. Required before merging to main.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Indexes & links are current (fix with `npm run index`)
        run: node scripts/gen-index.mjs --check
      - name: Curated data is valid
        run: node scripts/data.mjs check
      - name: Type-check + build
        run: npm run build
