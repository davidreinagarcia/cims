# CIMS frontend (cims.queenalexandria.online). Copy kept in the repo at deploy/nginx-cims.conf.
# Why the headers: Cloudflare caches static extensions (.js, .json) for 4 hours when the origin says nothing, which left
# visitors on an old service worker after a deploy. The worker, the page and the manifest must always be revalidated;
# built files under /assets/ have a content hash in their name, so they can be cached forever.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
